[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aggregate-a"
version = "0.1.0"
description = "Daily market-implied estimate of aggregate relative risk aversion (A) with an uncertainty band."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "arch>=7.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pyarrow>=15",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "yfinance>=0.2.40",
  "matplotlib>=3.8",
  "plotly>=5.20",
]

[project.optional-dependencies]
sentiment = ["praw>=7.7", "transformers>=4.40", "torch>=2.2", "datasketch>=1.6"]
dash = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-requests", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/aggregate_a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live external data sources (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
